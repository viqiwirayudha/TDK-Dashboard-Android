name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TDK-Dashboard-Source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak source aplikasi
        run: unzip -o TDK-Dashboard-Source.zip

      - name: Build APK
        run: gradle -p TDK-Dashboard-Android assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: TDK-Dashboard-APK
          path: TDK-Dashboard-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
