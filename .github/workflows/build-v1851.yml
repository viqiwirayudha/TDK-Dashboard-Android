name: Build APK V18.5.1 FIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cek struktur project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Struktur project OK"

      - name: Build APK V18.5.1
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Siapkan nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TDK-Dashboard-V18.5.1.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: TDK-Dashboard-V18.5.1
          path: TDK-Dashboard-V18.5.1.apk
          if-no-files-found: error
          retention-days: 30

